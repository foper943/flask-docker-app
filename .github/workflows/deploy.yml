name: CI/CD — сборка, миграции и деплой

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Тег образа для отката (например: sha-abc1234)"
        required: true
        default: "latest"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ------------------------------------------------------------------
  # 1. Сборка Docker-образа и пуш в GitHub Container Registry
  # ------------------------------------------------------------------
  build:
    name: Сборка образа
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: sha-${{ github.sha }}

    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v4

      - name: Авторизация в GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Сборка и пуш образа
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}

  # ------------------------------------------------------------------
  # 2. Применение миграций (одноразовый контейнер)
  #    Если завершается с ошибкой — деплой не происходит
  # ------------------------------------------------------------------
  migrate:
    name: Применение миграций
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'

    steps:
      - name: Авторизация в GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Запуск миграций
        run: |
          docker run --rm \
            -e DATABASE_URL=${{ secrets.DATABASE_URL }} \
            -e REDIS_URL=${{ secrets.REDIS_URL }} \
            -e SERVICE_NAME=migrate \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }} \
            python cli.py migrate

  # ------------------------------------------------------------------
  # 3. Деплой на staging-сервер через SSH
  # ------------------------------------------------------------------
  deploy:
    name: Деплой на staging
    runs-on: ubuntu-latest
    needs: migrate
    if: github.event_name == 'push'
    environment: staging

    steps:
      - name: Деплой через SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd /opt/peer-learn
            export IMAGE_TAG=sha-${{ github.sha }}
            export DOCKER_USERNAME=ghcr.io/${{ github.repository_owner }}
            docker-compose pull
            docker-compose up -d --remove-orphans

  # ------------------------------------------------------------------
  # 4. Проверка работоспособности после деплоя
  # ------------------------------------------------------------------
  healthcheck:
    name: Проверка health-эндпоинта
    runs-on: ubuntu-latest
    needs: deploy
    if: github.event_name == 'push'

    steps:
      - name: Ожидание готовности сервиса
        run: |
          curl --retry 5 --retry-delay 3 --retry-connrefused \
            -f http://${{ secrets.STAGING_HOST }}/health

  # ------------------------------------------------------------------
  # 5. Ручной откат на указанный тег образа
  # ------------------------------------------------------------------
  rollback:
    name: Откат на предыдущую версию
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    environment: staging

    steps:
      - name: Откат через SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd /opt/peer-learn
            export IMAGE_TAG=${{ github.event.inputs.image_tag }}
            export DOCKER_USERNAME=ghcr.io/${{ github.repository_owner }}
            docker-compose pull
            docker-compose up -d --remove-orphans
            echo "Откат на образ: $IMAGE_TAG"
