name: Build and Push Docker Image

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Авторизация в Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Сборка образа
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/my_app:${{ github.sha }} .

      - name: Пуш образа
        run: docker push ${{ secrets.DOCKER_USERNAME }}/my_app:${{ github.sha }}

      - name: Тег latest
        run: docker tag ${{ secrets.DOCKER_USERNAME }}/my_app:${{ github.sha }} ${{ secrets.DOCKER_USERNAME }}/my_app:latest

      - name: Пуш latest
        run: docker push ${{ secrets.DOCKER_USERNAME }}/my_app:latest
