services:
  - type: web
    name: peer-learn-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 5000
      - key: DEBUG
        value: "False"
      - key: SERVICE_NAME
        value: app
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: peer-learn-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: peer-learn-redis
          type: redis
          property: connectionString
      - key: APP_VERSION
        value: render

  - type: worker
    name: peer-learn-migrate
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    dockerCommand: python cli.py migrate
    envVars:
      - key: SERVICE_NAME
        value: migrate
      - key: DATABASE_URL
        fromDatabase:
          name: peer-learn-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: peer-learn-redis
          type: redis
          property: connectionString

  # Redis — это сервис, а не база данных в терминах Render
  - type: redis
    name: peer-learn-redis
    plan: free
    ipAllowList: []

databases:
  - name: peer-learn-db
    plan: free
    databaseName: peer_learn
    user: peer_learn_user
