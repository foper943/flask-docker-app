<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Peer Learn</title>
  <script>
    // GitHub Pages возвращает 404 для любого пути кроме корня.
    // Этот скрипт перенаправляет на index.html, сохраняя путь в query string.
    var seg = 1
    var l = window.location
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + seg).join('/') + '/?p=/' +
      l.pathname.slice(1).split('/').slice(seg).join('/').replace(/&/g, '~and~') +
      (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    )
  </script>
</head>
<body></body>
</html>
