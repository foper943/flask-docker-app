<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PeerLearn — Платформа взаимного обучения</title>
    <script>
      // Восстанавливает путь после редиректа из 404.html (GitHub Pages SPA trick)
      ;(function() {
        var redirect = sessionStorage.redirect
        delete sessionStorage.redirect
        if (redirect && redirect !== location.href) {
          history.replaceState(null, null, redirect)
        }
        var p = new URLSearchParams(location.search).get('p')
        if (p) {
          history.replaceState(null, null,
            location.pathname.split('/').slice(0, 2).join('/') + p +
            (new URLSearchParams(location.search).get('q') || '').replace(/~and~/g, '&')
          )
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
